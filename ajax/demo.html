<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="jquery-3.6.0.js"></script>
</head>
<body>
<h1>Student list</h1>
<div>
    <input id = "name"><br>
    <input type="radio" name="gender" checked value="1"> Male
    <input type="radio" name="gender" value="0"> Female
    <input type="radio" name="gender" value="-1"> LGBT<br>
    <select id="classId">
        <option value="1">C09</option>
        <option value="2">C10</option>
        <option value="3">C11</option>
        <option value="30">C11</option>
    </select>
    <button id="btn-save" onclick="save()">Save</button>
</div>
<table border="1" style="border-collapse: collapse">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Gender</th>
        <th>Class name</th>
    </tr>
    <tbody id="content">

    </tbody>
</table>
<button onclick="displayMore()">More</button>
<script>
    let page =0;
    display();
    function displayMore(){
        page++;
        display(page)
    }
    function save(){
        // lấy dữ liệu => student => call API để thê mưới
        let name = $('#name').val();
        let gender = $('input[name="gender"]:checked').val();
        let classId = $('#classId').val();
        let student = {
            name: name,
            gender: gender,
            classCG: {
                id: classId
            }

        }
        console.log(student);
        $.ajax({
            dataType: "json",
            contentType: "application/json",
            url: `http://localhost:8080/api/v1/students`,
            type: 'post',
            data: JSON.stringify(student),
            complete: function (res, textStatus){
                console.log(res.status);
                if (res.status===201){
                    console.log("-----Thành công-----------")
                }else {
                    console.log("không thành công")
                }
                display();
            }
        })
    }
    function display (page=0){
        $.ajax({
            dataType: "json",
            url: `http://localhost:8080/api/v1/students?page=${page}`,
            type: 'get',
            success: function (data, res){
                console.log(data);
                let content ="";
                for (let i = 0; i <data.content.length ; i++) {
                    content +=`<tr>
                                    <td>${data.content[i].id}</td>
                                    <td>${data.content[i].name}</td>
                                    <td>${data.content[i].gender}</td>
                                    <td>${data.content[i].classCG.name}</td>
                                </tr>`
                }
                $('#content').append(content);
            }
        })
    }
</script>
</body>
</html>
