<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="jquery-3.6.0.js"></script>
</head>
<body>
<div>
    <input id="name"><br>
    <input type="radio" name="gender" value="1">Male
    <input type="radio" name="gender" value="0">Female
    <input type="radio" name="gender" value="-1">LGBT<br>
    <select id="classId">
        <option value="1">C09</option>
        <option value="2">C10</option>
        <option value="3">C11</option>
    </select><br>
    <button id="btn-save">Lưu</button>
</div>
<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Gender</th>
        <th>Class Name</th>
    </tr>
    <tbody id="content">
    <tr>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
    </tr>
    </tbody>

</table>
<button id="btn-more">Xem thêm</button>
<script>
    $(document).ready(function (){
        let page =0;
        display();
        $('#btn-more').click(displayMore);
        $('#btn-save').click(save);
        function save(){
            let name = $("#name").val();
            let gender = $('input[name="gender"]:checked').val();
            let classId = $("#classId").val();
            const student = {
                name,
                gender,
                classCG: {
                    id: classId
                }
            }
            console.log(student)
            $.ajax({
                url:`http://localhost:8080/api/v1/students`,
                dataType: "json",
                contentType: "application/json",
                type: "post",
                data: JSON.stringify(student),
                success: function ( data, textStatus, res){
                    console.log("thêm mới thành công")
                    console.log(res.status);
                    page=0;
                    display(page);
                },
                error: function (res){
                    console.log("-----------lỗi---------")
                    console.log(res.status)
                }
            });
        }
        function displayMore(){
            page++;
            display(page);
        }
        function display(page=0){
            console.log("hello")
            $.ajax({
                url:`http://localhost:8080/api/v1/students?page=${page}`,
                dataType: "json",
                type: "get",
                success: function ( data, textStatus, res){
                    console.log("------data------------");
                    let content ="";
                    for (let i = 0; i <data.content.length ; i++) {
                        content +=`    <tr>
                                        <td>${data.content[i].id}</td>
                                        <td>${data.content[i].name}</td>
                                        <td>${data.content[i].gender}</td>
                                        <td>${data.content[i].classCG.name}</td>
                                    </tr>`
                    }
                    $("#content").append(content)
                    console.log(data);
                    console.log(textStatus)
                    console.log(res.status)
                },
                error: function (res){
                    console.log("-----------lỗi---------")
                    console.log(res.status)
                }
            });
        }
    });


</script>
</body>
</html>
